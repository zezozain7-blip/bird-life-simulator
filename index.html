<body class="ui2">
<canvas id="game"></canvas>
<div id="hud">
  <div id="hud-top">
    <div class="pill lvl"><div class="lvl-n" id="h-lvl">1</div><div class="xpbar"><i id="h-xp"></i></div></div>
    <div class="pill"><span class="ic gold" data-ic="coin" data-sz="18"></span><b id="h-coins">0</b></div>
    <div class="pill"><span class="ic" data-ic="grain" data-sz="18"></span><b id="h-feed">0</b></div>
    <div class="pill"><span class="ic" data-ic="birds" data-sz="18"></span><b id="h-birds">0</b></div>
    <div class="pill wide"><span class="ic" id="h-wic" data-ic="sun" data-sz="18"></span><b id="h-time">8:00</b></div>
    <button class="pill btn" id="b-lang">EN</button>
  </div>
  <div id="side-r">
    <button class="sq" id="b-build" data-ic="build"></button>
    <button class="sq" id="b-tasks"><span data-ic="tasks"></span><span class="badge" id="h-badge"></span></button>
    <button class="sq" id="b-tools" data-ic="tools"></button>
  </div>
  <div id="tools" class="hidden">
    <button class="sq" id="b-zin" data-ic="plus"></button>
    <button class="sq" id="b-zout" data-ic="minus"></button>
    <button class="sq" id="b-center" data-ic="center"></button>
    <button class="sq spd" id="b-speed">x1</button>
    <button class="sq" id="b-skip" data-ic="ff"></button>
    <button class="sq" id="b-snd" data-ic="sound"></button>
  </div>
  <div id="side-l">
    <button class="sq" id="b-feeder" data-ic="grain"></button>
    <button class="sq" id="b-water" data-ic="drop"></button>
    <button class="sq fly" id="b-fly" data-ic="birds"></button>
  </div>
  <div id="alerts"></div>
  <div id="ticker"><span class="ic" data-ic="egg" data-sz="20"></span><span id="tick-txt"></span><span class="chev" data-ic="chev" data-sz="18"></span></div>
  <div id="nav">
    <button data-nav="farm" class="on"><i data-ic="farm" data-sz="26"></i><span data-i="nav_farm"></span></button>
    <button data-nav="birds"><i data-ic="birds" data-sz="26"></i><span data-i="nav_birds"></span></button>
    <button data-nav="breeding"><i data-ic="egg" data-sz="26"></i><span data-i="nav_breeding"></span></button>
    <button data-nav="market"><i data-ic="market" data-sz="26"></i><span data-i="nav_market"></span></button>
    <button data-nav="manage"><i data-ic="manage" data-sz="26"></i><span data-i="nav_manage"></span></button>
  </div>
</div>
<div id="toast"></div>
<div id="sheet" class="hidden"><div id="sheet-bar"><div id="sheet-title"></div><button id="sheet-x">✕</button></div><div id="sheet-body"></div></div>

<script src="js/scene.js?v=57"></script>
<script src="js/ui.js?v=57"></script>

<style>
#goal{position:fixed;left:8px;bottom:calc(132px + env(safe-area-inset-bottom));max-width:82%;padding:8px 12px;border-radius:20px;background:linear-gradient(#3b342a,#1f1b15);border:1.5px solid #6d5a34;color:#f5ead2;font-size:13px;font-weight:700;z-index:6;display:none;pointer-events:none;box-shadow:0 2px 6px #0008}
#goal b{color:#ffe9a8}
.bst{position:fixed;font-size:26px;pointer-events:none;z-index:40;animation:bst 1.1s ease-out forwards}
@keyframes bst{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.bst{display:none}}
</style>
<div id="goal"></div>
<script src="js/v20.js?v=57"></script>
<style>
#sev{position:fixed;left:8px;bottom:calc(132px + env(safe-area-inset-bottom));max-width:68%;padding:8px 12px;border-radius:20px;background:linear-gradient(#3b342a,#1f1b15);border:1.5px solid #d8b04a;color:#f5ead2;font-size:13px;font-weight:700;z-index:6;display:none;pointer-events:none}
#hubb{position:fixed;right:8px;bottom:calc(132px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;background:linear-gradient(#3b342a,#1f1b15);border:1.5px solid #d8b04a;font-size:22px;z-index:7;color:#f5ead2}
#hub{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#hub .c{max-width:420px;width:100%;max-height:80%;overflow:auto;background:#1f1b15;border:1.5px solid #d8b04a;border-radius:18px;padding:16px;color:#f5ead2;line-height:1.7;font-size:14px}
#hub h3{margin:0 0 8px;color:#ffe9a8}#hub button{margin-top:10px;width:100%;padding:11px;border-radius:12px;border:0;background:#d8b04a;color:#241c0a;font:inherit;font-weight:800}
</style>
<div id="sev"></div><button id="hubb" aria-label="hub">🏅</button><div id="hub"></div>
