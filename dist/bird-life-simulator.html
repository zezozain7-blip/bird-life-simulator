<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1710">
<title>Bird Life Simulator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1710;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;color:#f5ead2;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#hud-top{position:absolute;top:max(6px,env(safe-area-inset-top));left:6px;right:6px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;height:34px;padding:0 9px;border-radius:17px;background:linear-gradient(#3b342a,#1f1b15);border:1.5px solid #6d5a34;box-shadow:0 2px 6px #0008;font-size:14px}
.pill b{font-weight:700}.pill .ic{font-size:16px}
.pill.lvl{padding:0 8px 0 0;gap:6px}
.lvl-n{width:34px;height:34px;margin-left:-2px;border-radius:50%;background:radial-gradient(#4a4234,#1c1812);border:2px solid #d8b04a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#ffe9a8}
.xpbar{width:46px;height:8px;border-radius:4px;background:#0007;overflow:hidden}.xpbar i{display:block;height:100%;width:0;background:linear-gradient(#7fd24d,#3c8f2a)}
.pill b{direction:ltr;unicode-bidi:embed}
.pill.btn{pointer-events:auto;color:#f5ead2;font-weight:700}
#side-r,#side-l,#tools{position:absolute;top:100px;display:flex;flex-direction:column;gap:8px}
#side-r{right:6px}#side-l{left:6px}
.sq{position:relative;width:46px;height:46px;border-radius:12px;background:linear-gradient(#3b342a,#1f1b15);border:1.5px solid #6d5a34;color:#fff;font-size:20px;box-shadow:0 2px 6px #0008}
.sq:active,.pill.btn:active,#nav button:active{filter:brightness(1.3)}
.sq.spd{font-size:14px;font-weight:800;color:#ffd978}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#d33;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
#ticker{position:absolute;left:8px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:78%;display:none;align-items:center;gap:8px;padding:7px 12px;border-radius:22px;background:linear-gradient(#2c261d,#16130e);border:1.5px solid #6d5a34;font-size:14px;box-shadow:0 2px 6px #0008}
#ticker .chev{color:#e8b84a;font-size:20px;line-height:1}
#nav{position:absolute;left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom));display:flex;gap:5px}
#nav button{flex:1;height:68px;border-radius:14px;background:linear-gradient(#3a3329,#1c1913);border:1.5px solid #4a4030;color:#f0e4c8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;box-shadow:0 2px 8px #000a}
#nav button i{font-style:normal;font-size:24px;line-height:1}
#nav button.on{background:linear-gradient(#8a6a22,#4f3a10);border-color:#e3b84f}
#toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);background:#000c;border:1px solid #6d5a34;padding:9px 16px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center;z-index:30}
#toast.show{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:62%;display:flex;flex-direction:column;background:linear-gradient(#2a241b,#15120d);border-top:2px solid #d8b04a;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px #000b;z-index:20;transform:translateY(0);transition:transform .22s;touch-action:pan-y}
#sheet.hidden{transform:translateY(105%);pointer-events:none}
#sheet-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;font-weight:800;font-size:17px;color:#ffe3a0}
#sheet-x{width:34px;height:34px;border-radius:17px;background:#0006;color:#fff;border:1px solid #6d5a34;font-size:16px}
#sheet-body{overflow-y:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.rtl{direction:rtl;text-align:right}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{background:#0004;border:1px solid #5a4a2c;border-radius:12px;padding:8px;position:relative}
.card.sel{border-color:#e3b84f;box-shadow:0 0 0 1px #e3b84f inset}
.card canvas{display:block;margin:0 auto}
.card .nm{font-weight:700;font-size:13px;text-align:center}
.card .sm{font-size:11px;color:#c9b78d;text-align:center}
.btn2{padding:10px 14px;border-radius:12px;background:linear-gradient(#a67c1f,#6a4c0e);border:1.5px solid #e3b84f;color:#fff;font-weight:700;font-size:14px;flex:1;min-width:84px}
.btn2.alt{background:linear-gradient(#3b342a,#1f1b15);border-color:#6d5a34}
.btn2.red{background:linear-gradient(#a33,#611);border-color:#e66}
.btn2[disabled]{opacity:.4}
.bar{height:11px;border-radius:6px;background:#0007;overflow:hidden;flex:1;border:1px solid #0009}.bar i{display:block;height:100%}
.lab{width:86px;font-size:13px;color:#d9c9a0}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #ffffff14}.kv span:first-child{color:#bfae85}
h4{margin:12px 0 4px;color:#ffe3a0;font-size:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:9px;font-size:11px;background:#0005;border:1px solid #6d5a34;margin:1px}
.warn{color:#ff9a8a}.ok{color:#9be37a}
input.name{background:#0006;border:1px solid #6d5a34;color:#fff;border-radius:8px;padding:8px;font-size:15px;width:100%}
.prog{position:absolute;left:6px;right:6px;bottom:6px;height:6px;background:#0007;border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:#f1c24a}

.tl{font-size:12px;color:#c9b78d;text-align:center;margin-top:6px}
.trow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.tn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:#0005;border:1px solid #6d5a34;font-size:13px}
.tn i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0008}
.tn.hl{border-color:#e3b84f;background:#4a3a14}.tn.gone{opacity:.6}.tn small{color:#a99;font-size:10px}
.tarrow{text-align:center;color:#6d5a34;font-size:12px;line-height:1}
#side-r{top:100px}
#hint{position:fixed;left:12px;right:12px;top:150px;z-index:25;background:#000d;border:1.5px solid #d8b04a;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5;text-align:center}#hint small{color:#c9b78d}

#tools{right:60px}#tools.hidden{display:none}
.sq svg,.pill svg,#nav svg{display:block;margin:auto}.sq{display:flex;align-items:center;justify-content:center;padding:0}
.ic.gold{color:#f2c24a}.ic{display:inline-flex}
#nav button i{display:flex;font-style:normal;color:#f0d9a0}#nav button.on i{color:#fff}
#nav.rtl-nav{direction:rtl}
.sq{color:#f0e4c8}.pill .ic{color:#e8d6a0}.pill .ic.gold{color:#f2c24a}
.wel{font-size:15px;line-height:1.8}.wel div{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff14;padding:3px 0}
.ei{display:inline-flex;vertical-align:-3px;margin:0 2px;color:#e8d6a0}.ei svg{display:block}.warn .ei{color:#ff9a8a}

</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="hud-top">
    <div class="pill lvl"><div class="lvl-n" id="h-lvl">1</div><div class="xpbar"><i id="h-xp"></i></div></div>
    <div class="pill"><span class="ic gold" data-ic="coin" data-sz="18"></span><b id="h-coins">0</b></div>
    <div class="pill"><span class="ic" data-ic="grain" data-sz="18"></span><b id="h-feed">0</b></div>
    <div class="pill"><span class="ic" data-ic="birds" data-sz="18"></span><b id="h-birds">0</b></div>
    <div class="pill wide"><span class="ic" id="h-wic" data-ic="sun" data-sz="18"></span><b id="h-time">8:00</b></div>
    <button class="pill btn" id="b-lang">EN</button>
  </div>
  <div id="side-r">
    <button class="sq" id="b-build" data-ic="build"></button>
    <button class="sq" id="b-tasks"><span data-ic="tasks"></span><span class="badge" id="h-badge"></span></button>
    <button class="sq" id="b-tools" data-ic="tools"></button>
  </div>
  <div id="tools" class="hidden">
    <button class="sq" id="b-zin" data-ic="plus"></button>
    <button class="sq" id="b-zout" data-ic="minus"></button>
    <button class="sq" id="b-center" data-ic="center"></button>
    <button class="sq spd" id="b-speed">x1</button>
    <button class="sq" id="b-skip" data-ic="ff"></button>
    <button class="sq" id="b-snd" data-ic="sound"></button>
  </div>
  <div id="side-l">
    <button class="sq" id="b-feeder" data-ic="grain"></button>
    <button class="sq" id="b-water" data-ic="drop"></button>
  </div>
  <div id="ticker"><span class="ic" data-ic="egg" data-sz="20"></span><span id="tick-txt"></span><span class="chev" data-ic="chev" data-sz="18"></span></div>
  <div id="nav">
    <button data-nav="farm" class="on"><i data-ic="farm" data-sz="26"></i><span data-i="nav_farm"></span></button>
    <button data-nav="birds"><i data-ic="birds" data-sz="26"></i><span data-i="nav_birds"></span></button>
    <button data-nav="breeding"><i data-ic="egg" data-sz="26"></i><span data-i="nav_breeding"></span></button>
    <button data-nav="market"><i data-ic="market" data-sz="26"></i><span data-i="nav_market"></span></button>
    <button data-nav="manage"><i data-ic="manage" data-sz="26"></i><span data-i="nav_manage"></span></button>
  </div>
</div>
<div id="toast"></div>
<div id="sheet" class="hidden"><div id="sheet-bar"><div id="sheet-title"></div><button id="sheet-x">✕</button></div><div id="sheet-body"></div></div>

<script>
// Simple Mendelian model. Two loci + 3 quantitative traits.
// Colour locus: G (blue-grey) > R (ash-red) > W (white). Pattern locus: B (bar) > C (checker).
BLS.Gen = (function(){
  var COL_RANK = {G:3,R:2,W:1};
  function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
  function phenoColor(g){ var a=g.c[0], b=g.c[1]; return COL_RANK[a]>=COL_RANK[b]?a:b; }
  function phenoPattern(g){ return (g.p[0]==='B'||g.p[1]==='B')?'B':'C'; }
  function colorName(g){ return {G:'grey',R:'red',W:'white'}[phenoColor(g)]; }
  function patternName(g){ return phenoPattern(g)==='B'?'bar':'check'; }
  function randomGenes(){
    return { c:[rnd(['G','G','G','R','W']), rnd(['G','G','R','R','W'])], p:[rnd(['B','B','C']), rnd(['B','C'])],
             size:40+Math.random()*40|0, vit:40+Math.random()*40|0, fert:40+Math.random()*40|0 };
  }
  function mutateAllele(a, pool){ return Math.random()<0.03 ? rnd(pool) : a; }
  function cross(m, f){
    var t = function(v1,v2){ var v=(v1+v2)/2 + (Math.random()*16-8); return Math.max(20,Math.min(100,Math.round(v))); };
    return {
      c:[ mutateAllele(rnd(m.c),['G','R','W']), mutateAllele(rnd(f.c),['G','R','W']) ],
      p:[ mutateAllele(rnd(m.p),['B','C']), mutateAllele(rnd(f.p),['B','C']) ],
      size:t(m.size,f.size), vit:t(m.vit,f.vit), fert:t(m.fert,f.fert)
    };
  }
  function geneString(g){ return g.c.join('/')+'  '+g.p.join('/'); }
  return {phenoColor:phenoColor,phenoPattern:phenoPattern,colorName:colorName,patternName:patternName,randomGenes:randomGenes,cross:cross,geneString:geneString,rnd:rnd};
})();

<script>
// Simulation core: state, life cycle (aging, needs, eggs, hatching) and bird behaviour. No drawing here.
BLS.Sim = (function(){
  var C = BLS.CFG, Gen = BLS.Gen;
  var G = null, listeners = {};
  var L = BLS.LAYOUT = {
    nestPos: function(i){ var col=i%4,row=(i/4)|0; return {x:2.2,y:1.3+col*1.05+0.45,z:0.45+row*0.9+0.04}; },
    feeder:{x:6.2,y:6.0}, water:{x:4.3,y:7.2},
    roofZ:2.72,
    perchSpots:[[4.2,4.3],[9.6,4.8],[8.6,6.8],[4.2,9.5]],
    roofPerch: function(){ var pl=G&&G.perches||[]; if(pl.length&&Math.random()<0.5){ var q=pl[(Math.random()*pl.length)|0], sp=L.perchSpots[q]; return {x:sp[0]+(Math.random()-0.5)*0.5,y:sp[1],z:0.95}; } return {x:1.0+Math.random()*1.5,y:1.2+Math.random()*4.4,z:L.roofZ}; },
    walkable: function(x,y){ return (x>2.9&&x<11.5&&y>3.5&&y<7.8) || (x>2.9&&x<6.6&&y>=7.8&&y<11.5); },
    randSpot: function(){ var best=null,bd=-1; for(var i=0;i<24;i++){ var x=3+Math.random()*8.4,y=3.6+Math.random()*7.8; if(!L.walkable(x,y)) continue; var md=9; var bs=G?G.birds:[]; for(var j=0;j<bs.length;j++){ if(bs[j].z>0.05) continue; var d=Math.hypot(bs[j].x-x,bs[j].y-y); if(d<md) md=d; } if(md>bd){ bd=md; best={x:x,y:y,z:0}; } if(bd>1.6) break; } return best||{x:5,y:5,z:0}; }
  };
  function emit(ev,a,b){ (listeners[ev]||[]).forEach(function(f){ f(a,b); }); }
  function on(ev,f){ (listeners[ev]=listeners[ev]||[]).push(f); }
  function T(k){ var s=(BLS.TXT[G&&G.lang||'ar'][k]||k); for(var i=1;i<arguments.length;i++) s=s.replace('{'+(i-1)+'}',arguments[i]); return s; }
  BLS.T = T;

  function stageOf(b){ return b.age<C.SQUAB_H?'squab':(b.age<C.JUVENILE_H?'juvenile':'adult'); }
  function hourOfDay(){ return (8+G.t)%24; }
  function dayNum(){ return Math.floor((8+G.t)/24)+1; }
  function bird(id){ for(var i=0;i<G.birds.length;i++) if(G.birds[i].id===id) return G.birds[i]; return null; }
  function pickName(){
    var list=BLS.NAMES[G.lang||'ar'], used={}; G.birds.forEach(function(b){used[b.name]=1;});
    var free=list.filter(function(n){return !used[n];});
    if(free.length) return Gen.rnd(free);
    return Gen.rnd(list)+' '+(G.nextId);
  }
  function newBird(o){
    var b={ id:G.nextId++, name:o.name||pickName(), sex:o.sex, g:o.g, age:o.age||0, hunger:o.hunger||10, thirst:o.thirst||10,
      health:100, mate:-1, nest:-1, parents:o.parents||[-1,-1], cool:6, clutch:0, layT:0, sickFlag:false,
      x:o.x||5, y:o.y||5, z:o.z||0, face:1, st:'idle', timer:1+Math.random()*2, ph:Math.random()*10, tx:0,ty:0, slot:0 };
    G.birds.push(b); G.archive[b.id]={name:b.name,sex:b.sex,parents:b.parents,col:Gen.phenoColor(b.g),pat:Gen.phenoPattern(b.g)}; return b;
  }
  function newGame(lang){
    G = { v:1, t:0, coins:C.START_COINS, feed:C.START_FEED, xp:0, level:1, birds:[], eggs:[], nests:[], nextId:1,
      feeder:{grain:1.5}, water:{amt:80}, tasks:{}, stats:{hatched:0,sold:0,bought:0,died:0,hand:0,boughtFeed:0},
      lang:lang||'ar', speed:1, archive:{}, log:[], savedAt:Date.now(), nestsOpen:4, perches:[] };
    for(var i=0;i<C.NEST_COUNT;i++) G.nests.push(null);
    var gm={c:['G','R'],p:['B','C'],size:66,vit:70,fert:72}, gf={c:['G','G'],p:['B','B'],size:60,vit:68,fert:74};
    var np=L.nestPos(0), rp=L.roofPerch();
    var m=newBird({sex:'M',g:gm,age:400,x:rp.x,y:rp.y,z:L.roofZ}), f=newBird({sex:'F',g:gf,age:400,x:np.x,y:np.y,z:np.z});
    m.st='perch'; m.timer=4; f.st='sit'; f.timer=3; f.face=-1; m.face=1;
    pairUp(m,f,true); f.cool=10;
    return G;
  }
  // ---------- relations
  function ancestors(id,depth,out){ out=out||{}; var a=G.archive[id]; if(!a||depth<=0) return out; a.parents.forEach(function(p){ if(p>0){ out[p]=1; ancestors(p,depth-1,out);} }); return out; }
  function related(a,b){
    if(a.id===b.id) return true;
    var A=ancestors(a.id,3), B=ancestors(b.id,3);
    if(A[b.id]||B[a.id]) return true;
    for(var k in A) if(B[k]) return true;
    return false;
  }
  function canPair(a,b){ return a&&b&&a.sex!==b.sex&&stageOf(a)==='adult'&&stageOf(b)==='adult'&&a.mate<0&&b.mate<0&&!related(a,b); }
  function freeNest(){ for(var i=0;i<Math.min(G.nests.length,G.nestsOpen);i++) if(!G.nests[i]) return i; return -1; }
  function pairUp(a,b,silent){
    var n=freeNest(); if(n<0) return false;
    var m=a.sex==='M'?a:b, f=a.sex==='M'?b:a;
    m.mate=f.id; f.mate=m.id; m.nest=f.nest=n; G.nests[n]={m:m.id,f:f.id};
    if(!silent) emit('toast',T('paired',m.name,f.name)); return true;
  }
  function nestContents(n){
    var e=G.eggs.filter(function(x){return x.nest===n;}).length;
    var s=G.birds.filter(function(x){return x.nest===n&&stageOf(x)==='squab';}).length;
    return e+s;
  }
  function unpair(b){
    var mt=bird(b.mate); b.mate=-1; if(mt) mt.mate=-1;
    releaseNests();
  }
  function releaseNests(){
    for(var n=0;n<G.nests.length;n++){
      var o=G.nests[n]; if(!o) continue;
      var m=bird(o.m), f=bird(o.f);
      var paired = m&&f&&m.mate===f.id;
      if(!paired && nestContents(n)===0){
        G.nests[n]=null; G.birds.forEach(function(x){ if(x.nest===n&&stageOf(x)!=='squab') x.nest=-1; });
        if(m){m.clutch=0;} if(f){f.clutch=0;}
      }
    }
  }
  function covered(n){ return G.birds.some(function(b){ return b.nest===n&&b.st==='sit'&&stageOf(b)!=='squab'; }); }
  // ---------- life cycle
  function addXp(v){ G.xp+=v; while(G.xp>=100*G.level){ G.xp-=100*G.level; G.level++; emit('toast','⭐ '+T('level')+' '+G.level); emit('sfx','level'); } }
  function layEgg(f,m,n){
    var fert=Math.random() < 0.35+((m.g.fert+f.g.fert)/2)/100*0.62;
    G.eggs.push({id:G.nextId++, nest:n, m:m.id, f:f.id, g:Gen.cross(m.g,f.g), prog:0, cold:0, fertile:fert, dead:false, deadT:0});
    emit('event',T('ev_egg',n+1),'breeding'); emit('sfx','egg'); G.stats.eggs=(G.stats.eggs||0)+1;
    [f,m].forEach(function(x){ if(x.st!=='fly'&&x.st!=='sit'){ x.timer=0; if(x.st==='walk'||x.st==='eat'||x.st==='drink'){} } });
  }
  function hatch(e){
    var m=bird(e.m), f=bird(e.f);
    var b=newBird({sex:Math.random()<0.5?'M':'F',g:e.g,age:0,parents:[e.m,e.f],hunger:20,thirst:20});
    b.nest=e.nest; var pos=L.nestPos(e.nest); b.x=pos.x; b.y=pos.y; b.z=pos.z; b.st='squabnest';
    var slot=G.birds.filter(function(x){return x.nest===e.nest&&stageOf(x)==='squab'&&x.id!==b.id;}).length; b.slot=slot%2;
    G.stats.hatched++; emit('sfx','hatch'); addXp(30); emit('event',T('ev_hatch',e.nest+1),'breeding');
  }
  function stepLife(dt,auto,protect){
    G.t+=dt;
    var i, b, hungerAdd=C.HUNGER_RATE*dt, thirstAdd=C.THIRST_RATE*dt;
    for(i=G.birds.length-1;i>=0;i--){
      b=G.birds[i]; var st0=stageOf(b);
      b.age+=dt; var stg=stageOf(b);
      b.hunger+=hungerAdd*(stg==='squab'?0.8:1); b.thirst+=thirstAdd*(stg==='squab'?0.8:1);
      if(stg==='squab'){
        var par=[bird(b.parents[0]),bird(b.parents[1])].filter(function(p){return p&&p.hunger<78&&p.thirst<85;});
        if(par.length){ b.hunger=Math.max(0,b.hunger-6*dt); b.thirst=Math.max(0,b.thirst-6*dt); }
      }
      if(auto){
        if(b.hunger>35&&G.feeder.grain>0){ var need=b.hunger-10,kg=Math.min(G.feeder.grain,need*C.GRAIN_PER_UNIT); G.feeder.grain-=kg; b.hunger-=kg/C.GRAIN_PER_UNIT; }
        if(b.thirst>35&&G.water.amt>0){ var nw=b.thirst-10,w=Math.min(G.water.amt,nw*C.WATER_PER_UNIT); G.water.amt-=w; b.thirst-=w/C.WATER_PER_UNIT; }
      }
      if(protect){ b.hunger=Math.min(b.hunger,80); b.thirst=Math.min(b.thirst,80); }
      b.hunger=Math.min(100,b.hunger); b.thirst=Math.min(100,b.thirst);
      if(b.hunger>90||b.thirst>90) b.health-=3*dt; else if(b.hunger<60&&b.thirst<60) b.health=Math.min(100,b.health+0.6*dt);
      if(protect&&b.health<30) b.health=30;
      if(b.health<45&&!b.sickFlag){ b.sickFlag=true; emit('event',T('ev_sick',b.name),'birds',b.id); }
      if(b.health>=60) b.sickFlag=false;
      if(b.health<=0){ die(b); continue; }
      if(st0==='squab'&&stg==='juvenile'){ // leaves nest
        var n=b.nest; b.nest=-1; b.st='idle'; b.timer=1; var gp=L.randSpot();
        b.fl={x0:b.x,y0:b.y,z0:b.z,x1:3.3+Math.random()*0.6,y1:L.nestPos(n).y,z1:0,t:0,dur:1.4,arc:0.8}; b.st='fly'; b.after='idle';
        emit('event',T('ev_grow',b.name),'birds',b.id);
        var pf=bird(b.parents[1]); if(pf&&pf.nest===n&&nestContents(n)===0){ pf.cool=Math.min(pf.cool,24); }
      }
      if(st0==='juvenile'&&stg==='adult') emit('event',T('ev_adult',b.name),'birds',b.id);
    }
    // eggs
    for(i=G.eggs.length-1;i>=0;i--){
      var e=G.eggs[i];
      if(e.dead){ if(G.t-e.deadT>12){ G.eggs.splice(i,1); emit('event',T('ev_bad',e.nest+1),'breeding'); } continue; }
      var cov = auto || covered(e.nest);
      if(cov) { e.prog+=dt; e.cold=Math.max(0,e.cold-dt*0.5); } else { e.cold+=dt; if(e.cold>C.EGG_COLD_LIMIT_H){ e.dead=true; e.deadT=G.t; emit('event',T('ev_cold',e.nest+1),'breeding'); continue; } }
      if(e.prog>=C.EGG_INCUBATION_H){
        if(e.fertile){ hatch(e); G.eggs.splice(i,1); } else { e.dead=true; e.deadT=G.t; }
      }
    }
    // laying
    G.birds.forEach(function(f){
      if(f.sex!=='F'||f.mate<0||f.nest<0) return;
      var m=bird(f.mate); if(!m) return; var n=f.nest;
      if(stageOf(f)!=='adult') return;
      f.cool-=dt;
      var cont=nestContents(n);
      if(f.clutch>0&&cont===0&&(f.clutch===2||G.t>f.layT)){ f.clutch=0; f.cool=Math.max(f.cool,30); }
      if(f.clutch===0&&f.cool<=0&&cont===0&&f.hunger<65&&f.thirst<65&&f.health>60){ layEgg(f,m,n); f.clutch=1; f.layT=G.t+24; }
      else if(f.clutch===1&&G.t>=f.layT&&cont<2&&f.hunger<80){ layEgg(f,m,n); f.clutch=2; }
    });
    releaseNests();
    if(G.feeder.grain<=0.001&&!stepLife._fw){ stepLife._fw=1; emit('event',T('ev_hungry'),'farm'); } if(G.feeder.grain>0.2) stepLife._fw=0;
    if(G.water.amt<=0.5&&!stepLife._ww){ stepLife._ww=1; emit('event',T('ev_dry'),'farm'); } if(G.water.amt>10) stepLife._ww=0;
  }
  function die(b){
    var i=G.birds.indexOf(b); if(i>=0) G.birds.splice(i,1);
    if(b.mate>=0){ var m=bird(b.mate); if(m) m.mate=-1; }
    G.stats.died++; emit('sfx','sad'); emit('event',T('ev_die',b.name),'birds'); releaseNests();
  }
  // ---------- behaviour (real time)
  function isNight(){ var h=hourOfDay(); return h>=21||h<5; }
  function needy(b){ return b.hunger>=55||b.thirst>=55; }
  function goto_(b,x,y,then){ b.tx=x; b.ty=y; b.st='walk'; b.after=then||'idle'; }
  function flyTo(b,x,y,z,then,dur){
    var d=Math.sqrt((x-b.x)*(x-b.x)+(y-b.y)*(y-b.y)+(z-b.z)*(z-b.z)); 
    b.fl={x0:b.x,y0:b.y,z0:b.z,x1:x,y1:y,z1:z,t:0,dur:dur||Math.max(0.9,d/2.4),arc:Math.min(1.2,0.35+d*0.08)};
    b.st='fly'; b.after=then||'idle'; setFace(b,x-b.x,y-b.y); emit('sfx','flap');
  }
  function setFace(b,dx,dy){ var sx=dx-dy; if(Math.abs(sx)>0.01) b.face=sx>=0?1:-1; }
  function aroundFeeder(){ var a=Math.random()*6.28; return {x:L.feeder.x+Math.cos(a)*0.55,y:L.feeder.y+Math.sin(a)*0.55}; }
  function aroundWater(){ var a=Math.random()*6.28; return {x:L.water.x+Math.cos(a)*0.45,y:L.water.y+Math.sin(a)*0.45}; }
  function think(b){
    var stg=stageOf(b); if(stg==='squab') return;
    var onGround=b.z<0.05;
    var mate=b.mate>=0?bird(b.mate):null;
    var hasEggs=b.nest>=0&&G.eggs.some(function(e){return e.nest===b.nest&&!e.dead;});
    // 1) needs first
    var fed=b.hunger<=42, wat=b.thirst<=42;
    if(!fed&&G.feeder.grain>0.01){
      if(!onGround){ var s=L.randSpot(); return flyTo(b,s.x,s.y,0,'idle'); }
      var p=aroundFeeder(); return goto_(b,p.x,p.y,'eat');
    }
    if(!wat&&G.water.amt>1){
      if(!onGround){ var s2=L.randSpot(); return flyTo(b,s2.x,s2.y,0,'idle'); }
      var q=aroundWater(); return goto_(b,q.x,q.y,'drink');
    }
    // 2) egg duty
    if(hasEggs&&!needy(b)){
      var want = b.sex==='F' || (mate&&mate.st!=='sit'&&needy(mate)) || !mate;
      if(b.sex==='M'&&mate&&mate.st==='sit') want=false;
      if(want){
        if(b.st==='sit'){ b.timer=1.5; return; }
        var np=L.nestPos(b.nest); return flyTo(b,np.x,np.y,np.z,'sit');
      }
    }
    if(b.st==='sit'&&(!hasEggs)&&isNight()&&b.nest>=0){ b.timer=3; return; }
    // 3) night rest
    if(isNight()){
      if(b.nest>=0&&mate&&!hasEggs){ if(b.st==='sit') {b.timer=3;return;} var n2=L.nestPos(b.nest); return flyTo(b,n2.x,n2.y,n2.z,'sit'); }
      if(b.st==='perch'||b.st==='sit'){ b.timer=3; return; }
      var rp=L.roofPerch(); return flyTo(b,rp.x,rp.y,rp.z,'perch');
    }
    // 4) day life
    if(b.st==='sit'||b.st==='perch'){ // come down

      return flyTo(b,s3.x,s3.y,0,'idle');

// Procedural sound (WebAudio, no files): coos, wing flaps, chimes, ambience. Starts after the first tap.
BLS.Audio = (function(){
  var ac=null, master=null, muted=false, amb=null, lastFlap=0, lastCoo=0;

})();

// Optional generated art. If files in assets/ exist they are used, otherwise the vector drawing stays.

      if(ps.length===1){ var dx=e.clientX-p.x, dy=e.clientY-p.y; if(!moved&&Math.hypot(e.clientX-startPos.x,e.clientY-startPos.y)>8) moved=true; if(moved){ cam.x-=dx/cam.z; cam.y-=dy/cam.z; follow=false; } p.x=e.clientX; p.y=e.clientY; }
      else if(ps.length>=2){ p.x=e.clientX; p.y=e.clientY; var d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y); if(lastPinch) cam.z*=d/lastPinch; lastPinch=d; } });
    function up(e){ var was=ptrs[e.pointerId]; delete ptrs[e.pointerId]; lastPinch=0; if(was&&!moved&&Object.keys(ptrs).length===0){ var hit=pick(e.clientX,e.clientY); if(BLS.UI) BLS.UI.onPick(hit); } }
    cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',function(e){ delete ptrs[e.pointerId]; });
    cv.addEventListener('wheel',function(e){ e.preventDefault(); cam.z*=e.deltaY<0?1.1:0.9; },{passive:false});
    function loop(now){ frame(now); requestAnimationFrame(loop); } requestAnimationFrame(loop);
  }
  return { init:init, focus:focus, cam:cam, fitZoom:fitZoom, select:function(id){ sel=id; if(id<0) follow=false; }, setFollow:function(v){ follow=v; }, isFollow:function(){return follow;}, get sel(){return sel;}, toScreen:toScreen, pick:pick, rebuild:function(){ buildLayers(); } };
})();

  }
  function showWelcome(w){
    var h='<div class="wel"><div><span>'+T('away')+'</span><b>'+ad(w.h)+' h</b></div><div><span>'+T('w_eggs')+'</span><b>'+ad(w.eggs)+'</b></div><div><span>'+T('w_hatch')+'</span><b>'+ad(w.hatched)+'</b></div><div><span>'+T('w_died')+'</span><b>'+ad(w.died)+'</b></div><div><span>'+T('w_grain')+'</span><b>'+ad(w.grain.toFixed(1))+' kg</b></div><div><span>'+T('w_water')+'</span><b>'+ad(Math.round(w.water))+'</b></div></div><p style="color:#c9b78d;font-size:12px">'+T('w_note')+'</p><div class="row"><button class="btn2" id="w-ok">'+T('ok')+'</button></div>';
    open('welcome',T('welcome'),h); $('w-ok').onclick=function(){ close(); };
  }
  // ----- events
  function onPick(hit){
    if(!hit){ if(cur.kind==='bird'||cur.kind==='pick') close(); else if(cur.kind) close(); return; }
    if(hit.type==='bird') showBird(hit.id);
    else if(hit.type==='nest') { if(hit.n>=Sim.G.nestsOpen) showBuild(); else showNest(hit.n); }
    else if(hit.type==='feeder') Sim.refillFeeder();
    else if(hit.type==='water') Sim.refillWater();
    else if(hit.type==='sacks') showMarket();
  }
  function init(){
    sheet=$('sheet'); body=$('sheet-body'); $('sheet-x').onclick=function(){ close(); }; window.addEventListener('popstate',function(){ if(cur.kind) close(true); });
    var G0=Sim.G; if(!G0.seenHint){ var hn=document.createElement('div'); hn.id='hint'; hn.innerHTML='<b>🕊️</b> '+T('tap_hint')+'<br><small>'+T('hatch_tip')+'</small>'; hn.onclick=function(){ hn.remove(); G0.seenHint=1; }; document.body.appendChild(hn); }
    Sim.on('toast',toast);
    Sim.on('event',function(m,go,id){ lastEvent={go:go,id:id}; var t=$('ticker'); $('tick-txt').innerHTML=BLS.Icons.emo(esc(m)); t.style.display='flex'; clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none';},9000); toast(m); });
    $('ticker').onclick=function(){ $('ticker').style.display='none'; if(lastEvent&&lastEvent.go==='breeding') showBreeding(); else if(lastEvent&&lastEvent.id) showBird(lastEvent.id); else if(lastEvent&&lastEvent.go==='birds') showBirds(); };
    document.querySelectorAll('#nav button').forEach(function(b){ b.onclick=function(){ var k=b.getAttribute('data-nav'); if(k==='farm') close(); else if(k==='birds') showBirds(); else if(k==='breeding') showBreeding(); else if(k==='market') showMarket(); else showManage(); }; });
    $('b-zin').onclick=function(){ BLS.Scene.cam.z*=1.25; }; $('b-zout').onclick=function(){ BLS.Scene.cam.z/=1.25; };
    $('b-center').onclick=function(){ var c=BLS.Scene.cam; c.tx=60; c.ty=215; c.tz=BLS.Scene.fitZoom(); BLS.Scene.setFollow(false); };
    $('b-tasks').onclick=showTasks;
    $('b-speed').onclick=function(){ var G=Sim.G; G.speed=G.speed===1?2:G.speed===2?4:1; hud(); toast('x'+G.speed); };
    function sndIc(){ $('b-snd').setAttribute('data-ic',BLS.Audio.isOn()?'sound':'mute'); BLS.Icons.fill($('b-snd').parentNode); }
    $('b-snd').onclick=function(){ BLS.Audio.toggle(); BLS.Audio.start(); sndIc(); }; sndIc(); $('b-tools').onclick=function(){ $('tools').classList.toggle('hidden'); }; $('b-build').onclick=showBuild;
    $('b-feeder').onclick=Sim.refillFeeder; $('b-water').onclick=Sim.refillWater;
    $('b-skip').onclick=function(){ Sim.skip(6); toast('+6h'); };
    $('b-lang').onclick=function(){ var G=Sim.G; G.lang=G.lang==='ar'?'en':'ar'; applyLang(); if(cur.kind) close(); hud(); };
    BLS.Icons.fill(document); applyLang(); hud(); if(Sim.G.welcome){ var w=Sim.G.welcome; delete Sim.G.welcome; var hh=document.getElementById('hint'); if(hh){ hh.remove(); Sim.G.seenHint=1; } showWelcome(w); } setInterval(hud,250);
  }
  return {init:init,applyLang:applyLang,onPick:onPick,toast:toast,hud:hud,showBird:showBird,showBreeding:showBreeding,close:close,showNest:showNest,showTree:showTree,showBuild:showBuild};
})();

</script>
<script>
(function(){
  var Sim=BLS.Sim;
  if(!Sim.load()) Sim.newGame('ar');
  BLS.Scene.init(document.getElementById('game'));
  BLS.Art.init(function(){ if(BLS.Art.count()&&BLS.Scene.rebuild) BLS.Scene.rebuild(); });
  BLS.UI.init();
  var A=BLS.Audio;
  Sim.on('sfx',function(n){ A.play(n); });
  ['pointerdown','touchstart','keydown'].forEach(function(e){ window.addEventListener(e,function(){ A.start(); },{passive:true}); });
  document.addEventListener('click',function(e){ if(e.target.closest&&e.target.closest('button')) A.play('click'); });
  setInterval(A.tick,4500);
  var last=performance.now();
  function tick(now){ var dt=(now-last)/1000; last=now; Sim.update(dt); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
  setInterval(Sim.save,5000);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) Sim.save(); });
  window.addEventListener('pagehide',Sim.save);
  window.BLS_DEBUG={Sim:Sim};
})();

</script>
</body>
